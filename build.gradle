import org.gradle.api.attributes.java.TargetJvmVersion

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'ca.stepwisegamestudios'
version = '1.0'

shadowJar {
    relocate 'net.kyori', 'ca.stepwisegamestudios.horsetopia.libs.kyori'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven { url = "https://repo.dmulloy2.net/repository/public/" }
    maven { url = "https://repo.extendedclip.com/releases/" }
}

// Allows Gradle (running on Java 24) to accept Paper API 26.2 (requires Java 25)
configurations.compileClasspath {
    attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.+'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'com.comphenix.protocol:ProtocolLib:5.3.0'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    implementation 'net.kyori:adventure-api:4.17.0'
    implementation 'net.kyori:adventure-text-minimessage:4.17.0'
    implementation 'net.kyori:adventure-platform-bukkit:4.3.4'
}

build {
    dependsOn shadowJar
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(25)) // javac 25 for compilation
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21 // output Java 21 bytecode so Shadow can process it
}